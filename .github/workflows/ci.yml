name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  WASM_BINDGEN: "0.2.130"

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal -c clippy,rustfmt,llvm-tools-preview && rustup default $RUST_TOOLCHAIN
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p arevei-core -- --check
      - run: cargo clippy -p arevei-core --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - name: Tests + coverage gate (≥ 80% lines)
        run: cargo llvm-cov -p arevei-core --locked --fail-under-lines 80 --summary-only

  wasm-reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal -t wasm32-unknown-unknown && rustup default $RUST_TOOLCHAIN
      - run: cargo install wasm-bindgen-cli --version $WASM_BINDGEN --locked
      - name: Build twice, hashes must match
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          bash scripts/build-wasm.sh | tail -1 > h1
          cargo clean -p arevei-core --release --target wasm32-unknown-unknown
          bash scripts/build-wasm.sh | tail -1 > h2
          diff h1 h2
      - uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: packages/core-wasm/pkg

  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: arevei
          POSTGRES_PASSWORD: arevei
          POSTGRES_DB: arevei
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arevei" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal -c clippy && rustup default $RUST_TOOLCHAIN
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p arevei-server --all-targets --locked -- -D warnings
      - name: Integration tests (incl. zero-plaintext canary dump)
        env:
          DATABASE_URL: postgres://arevei:arevei@localhost:5432/arevei
          REDIS_URL: redis://localhost:6379/0
          CI_POSTGRES_SERVICE: "true"
        run: cargo test -p arevei-server --locked -- --test-threads=1

  web:
    needs: wasm-reproducible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-wasm
          path: packages/core-wasm/pkg
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: node web/scripts/check-csp.mjs web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  extension:
    needs: wasm-reproducible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-wasm
          path: packages/core-wasm/pkg
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter extension typecheck
      - run: pnpm --filter extension test
      - run: pnpm --filter extension build
      - run: npx playwright install --with-deps chromium
      - name: Extension e2e (save, update, autofill, phishing cases)
        run: xvfb-run -a pnpm --filter extension e2e
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked && cargo audit
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - run: pnpm audit --prod --audit-level high

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, server, web, extension, supply-chain]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: actions/download-artifact@v4
        with: { name: extension-dist, path: extension/dist }
      - uses: sigstore/cosign-installer@v3
      - name: Sign published bundle hashes (verified by the extension, architecture §12.3)
        run: |
          cp web/dist/bundle-hashes.json bundle-hashes.json
          (cd extension/dist && zip -qr ../../arevei-vault-extension-chrome.zip chrome)
          sha256sum arevei-vault-extension-chrome.zip >> SHA256SUMS
          cosign sign-blob --yes bundle-hashes.json --output-signature bundle-hashes.json.sig --output-certificate bundle-hashes.json.pem
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bundle-hashes.json
            bundle-hashes.json.sig
            bundle-hashes.json.pem
            arevei-vault-extension-chrome.zip
            SHA256SUMS
