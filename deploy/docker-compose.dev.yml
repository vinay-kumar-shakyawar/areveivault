# Development / test dependencies only. Ports bound to localhost.
#   docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: arevei-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arevei
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - arevei-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    container_name: arevei-dev-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
volumes:
  arevei-dev-pg:
