# Render Blueprint: hosts the Arevei Vault API (Rust), Postgres and Redis.
# The web bundle is served by Vercel (deploy/vercel/web.json), which rewrites /api/* here.
# Apply: https://render.com/deploy?repo=https://github.com/vinay-kumar-shakyawar/areveivault
services:
  - type: web
    name: arevei-vault-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arevei-vault-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: arevei-vault-redis
          property: connectionString
      - key: SERVER_SECRET_KEY
        generateValue: true # base64-encoded 256-bit value, the format parse_secret expects
      - key: PUBLIC_ORIGIN
        value: https://arevei-vault-web.vercel.app
      - key: BIND_ADDR
        value: 0.0.0.0:10000
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_SIGNUP
        value: "true"
      - key: ATTACHMENT_DIR
        value: /data/attachments
      - key: RUST_LOG
        value: info

  - type: keyvalue
    name: arevei-vault-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru # Redis only holds rate-limit counters
    ipAllowList: [] # internal access only

databases:
  - name: arevei-vault-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
